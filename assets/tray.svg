  <circle cx="256" cy="256" r="218" fill="#111827"/>
  <g fill="#FBC711">
    <circle cx="176" cy="212" r="30"/>
    <circle cx="176" cy="300" r="30"/>
    <rect x="232" y="190" width="140" height="44" rx="22"/>
    <rect x="232" y="278" width="88" height="44" rx="22"/>
  </g>
</svg>
