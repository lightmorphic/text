<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lightmorphic Text">
  <title>Lightmorphic Text</title>
  <!-- Square artwork; everything meaningful sits inside a 432px circular
       safe area centred at 256,256 so a circular launcher crop loses nothing. -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#111827"/>
  <g fill="#FBC711">
    <!-- The colon that starts every Espanso trigger. -->
    <circle cx="176" cy="212" r="30"/>
    <circle cx="176" cy="300" r="30"/>
    <!-- Two lines of expanded text to its right. -->
    <rect x="232" y="190" width="140" height="44" rx="22"/>
    <rect x="232" y="278" width="88" height="44" rx="22"/>
  </g>
</svg>
